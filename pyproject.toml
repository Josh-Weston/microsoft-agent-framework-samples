[project]
name = "microsoft-agent-framework-samples"
version = "0.1.0"
description = "A repository of sample code for the Microsoft Agent Framework."
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "agent-framework-anthropic==1.0.0b261022",
    "agent-framework-core==1.22.0",
    "agent-framework-foundry==1.15.0",
    "agent-framework-gemini>=1.0.0b260827",
    "agent-framework-ollama==1.0.0b260730",
    "agent-framework-openai==1.17.0",
    "agent-framework-orchestrations==1.3.2",
    "aiohttp>=3.13.5",
    "azure-ai-projects>=2.4.0",
    "azure-identity>=1.25.3",
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "notebook>=7.6.2",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pypdf>=6.7.5",
    "reportlab>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_lab"]
